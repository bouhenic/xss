<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche de produits</title>
</head>
<body>
    <header>
        <h1>Bienvenue sur notre boutique en ligne</h1>
    </header>
    <main>
        <form method="GET" action="">
            <label for="search">Rechercher un produit :</label>
            <input type="text" id="search" name="query" 
placeholder="Entrez un mot-clé" value="">
            <button type="submit">Rechercher</button>
        </form>

        <section id="results">
            <h2>Résultats de recherche</h2>
            <p id="result-message"></p>
        </section>
    </main>
</body>

<script>
    // Récupère les paramètres de l'URL
    const urlParams = new URLSearchParams(window.location.search);
    const query = urlParams.get('query');

    // Si une recherche a été effectuée, affiche un message
    if (query) {
        // Vulnérabilité : Injection directe dans le DOM sans échappement
        document.getElementById('result-message').innerHTML = `Vous avez 
recherché : "${query}"`;
    }
</script>
</html>
